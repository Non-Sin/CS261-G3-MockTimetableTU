services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64     # เปิดบรรทัดนี้ถ้าใช้ Mac ชิป M
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # สร้างฐานข้อมูล appdb อัตโนมัติ (SQL Server ไม่สร้างให้เอง) แล้วจบการทำงาน
  # ตารางต่าง ๆ Flyway จะสร้างตอน backend start
  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - '/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b -Q "IF DB_ID(''appdb'') IS NULL CREATE DATABASE appdb"'
    restart: "no"

  # Spring Boot → http://localhost:8080 (Flyway สร้างตารางตอน start)
  backend:
    build: ./backend
    container_name: backend
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=appdb;encrypt=true;trustServerCertificate=true"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      # US3 login: ไม่มี JWT_SECRET ให้ compose หยุดพร้อมข้อความ แทนที่ backend จะ start ไม่ขึ้น
      JWT_SECRET: ${JWT_SECRET:?ต้องตั้ง JWT_SECRET ใน .env (ดู .env.example)}
      TU_API_APPLICATION_KEY: ${TU_API_APPLICATION_KEY:-}
      # ใส่ SPRING_PROFILES_ACTIVE=stub-tu ใน .env ถ้าจะใช้ TU API ปลอมแทนของจริง
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Next.js → http://localhost:3000 (rewrite /api/* ไปที่ backend ภายใน network ของ compose)
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    container_name: frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  sqlserver-data:
